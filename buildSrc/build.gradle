apply plugin: 'groovy'

configurations {
    compile.transitive = false
}

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    implementation gradleApi()
    localGroovy()
    implementation "org.grails:grails-docs:$grailsDocsVersion"
    //implementation "org.apache.groovy:groovy-all:$groovyVersion"
    implementation 'radeox:radeox:1.0-b2'
    implementation 'com.lowagie:itext:2.0.8'
    implementation 'org.xhtmlrenderer:core-renderer:R8'
    implementation "log4j:log4j:${log4jVersion}"
    implementation "org.slf4j:slf4j-api:$slf4jVersion"
    implementation "org.slf4j:slf4j-log4j12:$slf4jVersion"
    implementation "org.slf4j:jcl-over-slf4j:$slf4jVersion"
}


// resolve conflict with gradle groovy 3 and project groogy 4
tasks.withType(GroovyCompile).configureEach {
    if (name == "compileGroovy") {
        groovyOptions.forkOptions.jvmArgs += [
            "--add-opens", "java.base/java.lang=ALL-UNNAMED",
            "-Dgroovy.target.bytecode=17"
        ]
        groovyOptions.fork = true
        groovyClasspath = configurations.detachedConfiguration(
            dependencies.create("org.apache.groovy:groovy:$groovyVersion")
        )
    }
}