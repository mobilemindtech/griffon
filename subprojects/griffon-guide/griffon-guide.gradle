buildscript {
    repositories {
        mavenCentral()
        mavenLocal()
        gradlePluginPortal()
    }

    dependencies {
        //classpath 'me.champeau.gradle:gradle-javadoc-hotfix-plugin:0.1'
        classpath 'com.bmuschko:gradle-java2html-plugin:2.0.4'
    }
}


apply plugin: 'java'
apply plugin: 'groovy'
apply plugin: 'com.bmuschko.java2html'
//apply plugin: 'javadocHotfix'

afterEvaluate {
    tasks.named("java2htmlConvertCode") {
        dependsOn tasks.named("copyDocs")
        inputs.dir tasks.named("copyDocs").get().destinationDir
    }

    tasks.named("java2htmlGenerateOverview").configure {
        dependsOn tasks.named("java2htmlConvertCode")
        inputs.dir tasks.named("java2htmlConvertCode").get().destDir
    }
}

configurations {
    groovy
    docs { transitive = false }
}

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    // problems with ant classloader makes it necessary to duplicate the deps
    // in buildSrc/ and the docs configurations
    docs("org.apache.groovy:groovy-all:$groovyVersion",
            "org.grails:grails-docs:$grailsDocsVersion",
            'org.grails:grails-gdoc-engine:1.0.1',
            'radeox:radeox:1.0-b2',
            'com.lowagie:itext:2.0.8',
            'org.yaml:snakeyaml:1.9',
            'commons-lang:commons-lang:2.6',
            'org.xhtmlrenderer:core-renderer:R8',
            "log4j:log4j:${log4jVersion}",
            "org.slf4j:slf4j-api:$slf4jVersion",
            "org.slf4j:slf4j-log4j12:$slf4jVersion",
            "org.slf4j:jcl-over-slf4j:$slf4jVersion")

    java2html 'de.java2html:java2html:5.0'
    groovy "org.apache.groovy:groovy-all:$groovyVersion"
}


tasks.register('copyDocs', Copy) {
    destinationDir = "${layout.buildDirectory}/sources" as File
    from(project(":griffon-cli").sourceSets.main.allSource) {
        include 'griffon/test/**/*'
        include 'griffon/transform/**/*'
    }
    from(project(":griffon-rt").sourceSets.main.allSource)
}



tasks.register('apiDocs', Groovydoc) {
    dependsOn tasks.named("copyDocs")
    source          = file("$layout.buildDirectory/sources")
    destinationDir  = file("$layout.buildDirectory/api")
    docTitle        = "Griffon $version"
    header          = "Griffon $version"
    windowTitle     = "Griffon $version"
    groovyClasspath = configurations.groovy
    classpath       = files(
        project(":griffon-rt").sourceSets.main.output +
            project(":griffon-rt").configurations.runtimeClasspath
    )

    //includePrivate = true
    access = GroovydocAccess.PRIVATE
    includeAuthor = true
    includeMainForScripts = false
    processScripts = false
    use = true

    link('http://java.sun.com/j2se/1.5.0/docs/api', 'java.,org.xml.,javax.,org.xml.')
    link('http://www.dpml.net/api/ant/1.7.0', 'org.apache.ant.,org.apache.tools.ant.')
    link('http://kentbeck.github.com/junit/javadoc/latest/', 'org.junit.,junit.framework.')
    link('http://groovy.codehaus.org/api/', 'groovy.,org.codehaus.groovy.')

    doLast { task ->
        copy {
            into task.destinationDir
            from project(':').file('src/dist/media/griffon.ico'),
                 'src/guide/resources/css/stylesheet.css'
            // from('src/resources/javadoc') {
            //     into 'resources'
            // }
        }
        ant {
            replace(dir: task.destinationDir,
                    token: 'groovy.ico',
                    value: 'griffon.ico') {
                include(name: '**/*.html')
            }
        }
    }
}


tasks.register('jarApi', Jar) {
    dependsOn('apiDocs')
    archiveFileName.set("griffon-rt-${project.version}-javadoc.jar")
    destinationDirectory.set(file("$layout.buildDirectory/assemble/jars"))
    from "$layout.buildDirectory/api"
}

tasks.register('jarSource', Jar) {
    dependsOn(copyDocs)
    archiveFileName.set("griffon-rt-${project.version}-sources.jar")
    destinationDirectory.set(file("$layout.buildDirectory/assemble/jars"))
    from "$layout.buildDirectory/sources"
    exclude '**/*.html'
}

tasks.register('jarSourceHtml', Jar) {
    dependsOn('java2html')
    archiveFileName.set("griffon-rt-${project.version}-sources-html.jar")
    destinationDirectory.set(file("$layout.buildDirectory/assemble/jars"))
    from "$layout.buildDirectory/java2html"
}

tasks.register('cliApiDocs', Groovydoc) {
    source          = project(":griffon-cli").file('src/main/groovy')
    destinationDir = file("$layout.buildDirectory/cli-api")
    docTitle        = "Griffon $version"
    header          = "Griffon $version"
    windowTitle     = "Griffon $version"
    groovyClasspath = configurations.groovy
    classpath = files(
        project(":griffon-cli").sourceSets.main.output +
            project(":griffon-cli").configurations.runtimeClasspath
    )
    //includePrivate = true
    access = GroovydocAccess.PRIVATE
    includeAuthor = true
    includeMainForScripts = false
    processScripts = false
    use = true

    link('http://java.sun.com/j2se/1.5.0/docs/api', 'java.,org.xml.,javax.,org.xml.')
    link('http://www.dpml.net/api/ant/1.7.0', 'org.apache.ant.,org.apache.tools.ant.')
    link('http://kentbeck.github.com/junit/javadoc/latest/', 'org.junit.,junit.framework.')
    link('http://groovy.codehaus.org/api/', 'groovy.,org.codehaus.groovy.')

    doLast { task ->
        copy {
            into task.destinationDir
            from project(':').file('src/dist/media/griffon.ico'),
                'src/guide/resources/css/stylesheet.css'
            // from('src/resources/javadoc') {
            //     into 'resources'
            // }
        }
        ant {
            replace(dir: task.destinationDir,
                token: 'groovy.ico',
                value: 'griffon.ico') {
                include(name: '**/*.html')
            }
        }
    }
}

tasks.register('jarCliApi', Jar) {
    dependsOn('cliApiDocs')
    archiveFileName.set("griffon-cli-${project.version}-javadoc.jar")
    destinationDirectory.set(file("$layout.buildDirectory/assemble/jars"))
    from "$layout.buildDirectory/cli-api"
}

tasks.register('jarCliSource', Jar) {
    archiveFileName.set("griffon-cli-${project.version}-sources.jar")
    destinationDirectory.set(file("$layout.buildDirectory/assemble/jars"))
    from project(":griffon-cli").file('src/main/groovy')
    exclude '**/*.html'
}

tasks.register('jarDocs') {
    dependsOn('jarApi', 'jarSource', 'jarSourceHtml', 'jarCliApi', 'jarCliSource')
}

tasks.register('prepareGuide', Copy) {
    from('src/guide/src')
    doLast {
        ant {
            replace(dir: "$layout.buildDirectory/guide", includes: '**/*.*') {
                replacefilter(token: '@griffon.version@', value: version)
            }
        }
    }
    into("$layout.buildDirectory/guide")
}

tasks.register('buildGuide', GrailsDoc) {
    dependsOn('java2html', 'prepareGuide')
    srcDir    = file("$layout.buildDirectory/guide")
    props     = file('src/guide/guide.properties')
    imagesDir = file('src/guide/resources/img')
    styleDir  = file('src/guide/resources/style')
    cssDir    = file('src/guide/resources/css')
    outputDir = file("$layout.buildDirectory/manual")

    doFirst {
        copy {
            into("$layout.buildDirectory/manual/api")
            from("$layout.buildDirectory/api")
            into('src-html') {
                from("$layout.buildDirectory/java2html")
            }
        }
    }

    doLast {
        ant {
            replace(dir: "$layout.buildDirectory/manual") {
                replacefilter(token: '@griffon.version@', value: version)
            }
        }
    }
}

tasks.register('pdfGuide', PdfGuide) {
    dependsOn('buildGuide')
    inputs.files file("$layout.buildDirectory/manual/guide")
    pdfName = "griffon-guide-${version}.pdf"
}

tasks.register('dist', Zip) {
    dependsOn('pdfGuide', 'jarDocs')
    from "$layout.buildDirectory/manual"
}

tasks.register('java2html') {
    dependsOn 'apiDocs'
    dependsOn 'java2htmlGenerateOverview'
    dependsOn 'java2htmlConvertCode'
}

java2html {
    conversion {
        srcDirs = files("${layout.buildDirectory}/sources")
        destDir = file("${layout.buildDirectory}/java2html")
        tabs = 4
        style = 'eclipse'
        outputFormat = 'html'
        showLineNumbers = true
        addLineAnchors = true
        showFileName = true
        useShortFileName = true
        overwrite = true
        showDefaultTitle = true
        includeDocumentHeader = true
        includeDocumentFooter = true
    }

    overview {
        srcDirs = files("${layout.buildDirectory}/java2html")
        destDir = file("${layout.buildDirectory}/java2html")
        windowTitle = "Griffon $version"
        docTitle = "Griffon $version"
        docDescription = """Griffon is a Grails like application framework for developing desktop
                            applications in Groovy. Inspired by Grails, Griffon follows the Convention over
                            Configuration paradigm, paired with an intuitive MVC architecture and a command
                            line interface."""
        //header = "Griffon $version"
        icon = project(':').file('src/dist/media/griffon.ico')
        stylesheet = file('src/guide/resources/css/stylesheet.css')
    }
}

