apply plugin: 'java'

ext.pomDescription = 'Griffon common resources'

tasks.withType(Jar).all { task ->
    ext.appFileJar = false
}

tasks.register('jarSharedFiles', Jar) {
    ext.appFileJar = true
    dependsOn(':griffon-wrapper:dist')
    archiveFileName.set('griffon-shared-files.jar')
    destinationDirectory.set(file("$layout.buildDirectory/assemble/jars"))
    from(project(':griffon-wrapper').file('build/distributions/griffon-wrapper-files.zip'))
}

tasks.register('jarAppFiles', Jar) {
    ext.appFileJar = true
    archiveFileName.set('griffon-app-files.jar')
    destinationDirectory.set(file("$layout.buildDirectory/assemble/jars"))
    from('src/app') {
        into 'griffon-app'
    }
}

tasks.register('jarArchetypeFiles', Jar) {
    ext.appFileJar = true
    archiveFileName.set('griffon-archetype-files.jar')
    destinationDirectory.set(file("$layout.buildDirectory/assemble/jars"))
    from('src/archetype')
}

tasks.register('jarPluginFiles', Jar) {
    ext.appFileJar = true
    archiveFileName.set('griffon-plugin-files.jar')
    destinationDirectory.set(file("$layout.buildDirectory/assemble/jars"))
    from('src/plugin')
}

tasks.register('jarIntegrationFiles', Jar) {
    ext.appFileJar = true
    archiveFileName.set('griffon-integration-files.jar')
    destinationDirectory.set(file("$layout.buildDirectory/assemble/jars"))
    from('src/ide')
}

tasks.register('jarDistFiles', Jar) {
    ext.appFileJar = true
    archiveFileName.set('griffon-dist-files.jar')
    destinationDirectory.set(file("$layout.buildDirectory/assemble/jars"))
    from('src/dist')
}

tasks.register('jarDefaultBundles', Jar) {
    ext.appFileJar = true
    archiveFileName.set('griffon-default-bundles.jar')
    destinationDirectory.set(file("$layout.buildDirectory/assemble/jars"))
    from('src/bundles')
}

ext.resourceFilesJars = tasks.withType(Jar).matching({ task -> task.appFileJar } as Spec)

jar {
    dependsOn resourceFilesJars
    resourceFilesJars.each { task ->
        from task.outputs.files
    }
}
