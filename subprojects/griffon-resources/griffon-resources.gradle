apply plugin: 'java'

ext.pomDescription = 'Griffon common resources'

tasks.withType(Jar).all { task ->
    ext.appFileJar = false
}

tasks.register('jarSharedFiles', Jar) {
    ext.appFileJar = true
    dependsOn(':griffon-wrapper:dist')
    archiveFileName= 'griffon-shared-files.jar'
    destinationDirectory = layout.buildDirectory.dir('assemble/jars')
    from(project(':griffon-wrapper').file('build/distributions/griffon-wrapper-files.zip'))
}

tasks.register('jarAppFiles', Jar) {
    // Definimos que esta tarefa é um JAR de recursos do app
    ext.appFileJar = true

    archiveFileName = 'griffon-app-files.jar'

    // FORMA CORRETA: Use o método .dir() do buildDirectory diretamente
    // Isso mantém o "link" de dependência entre as propriedades
    destinationDirectory = layout.buildDirectory.dir("assemble/jars")

    from('src/app') {
        into 'griffon-app'
    }
}

tasks.register('jarArchetypeFiles', Jar) {
    ext.appFileJar = true
    archiveFileName = 'griffon-archetype-files.jar'
    destinationDirectory = layout.buildDirectory.dir("assemble/jars")
    from('src/archetype')
}

tasks.register('jarPluginFiles', Jar) {
    ext.appFileJar = true
    archiveFileName = 'griffon-plugin-files.jar'
    destinationDirectory = layout.buildDirectory.dir("assemble/jars")
    from('src/plugin')
}

tasks.register('jarIntegrationFiles', Jar) {
    ext.appFileJar = true
    archiveFileName = 'griffon-integration-files.jar'
    destinationDirectory = layout.buildDirectory.dir("assemble/jars")
    from('src/ide')
}

tasks.register('jarDistFiles', Jar) {
    ext.appFileJar = true
    archiveFileName = 'griffon-dist-files.jar'
    destinationDirectory = layout.buildDirectory.dir("assemble/jars")
    from('src/dist')
}

tasks.register('jarDefaultBundles', Jar) {
    ext.appFileJar = true
    archiveFileName = 'griffon-default-bundles.jar'
    destinationDirectory = layout.buildDirectory.dir('assemble/jars')
    from('src/bundles')
}

ext.resourceFilesJars = tasks.withType(Jar).matching({ task -> task.appFileJar } as Spec)

jar {
    dependsOn resourceFilesJars
    resourceFilesJars.each { task ->
        from task.outputs.files
    }
}
