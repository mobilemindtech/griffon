plugins {
    id 'groovy'
    id 'java-gradle-plugin'
    id 'maven-publish'
}

description = 'Gradle plugin for Griffon 1.x (griffon-mini) apps'

repositories {
    gradlePluginPortal()
}

dependencies {
    // Classes do Shadow para configurar o ShadowJar programaticamente
    implementation 'com.gradleup.shadow:shadow-gradle-plugin:9.4.1'
}

gradlePlugin {
    plugins {
        griffonPlugin {
            id = 'org.codehaus.griffon.gradle.plugin'
            implementationClass = 'org.codehaus.griffon.gradle.plugin.GriffonPlugin'
            displayName = 'Griffon Gradle Plugin'
            description = 'Run Griffon 1.x apps on modern Java, Groovy 6 and Gradle'
        }
    }
}

processResources {
    def tokens = [
        'griffonVersion' : rootProject.version.toString(),
        'groovyVersion'  : project.findProperty('groovyVersion'),
        'slf4jVersion'   : project.findProperty('slf4jVersion'),
        'reload4jVersion': project.findProperty('reload4jVersion')
    ]
    inputs.properties(tokens)
    expand(tokens)
}

// O plugin roda dentro do Gradle do app (no gym-desktop, JVM 17 x86) e é compilado pelo
// Groovy embutido no Gradle, que não lê class files do JDK 27: toolchain = javaRelease
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaRelease as int)
        vendor = JvmVendorSpec.AZUL
    }
}
tasks.withType(GroovyCompile).configureEach {
    sourceCompatibility = javaRelease
    targetCompatibility = javaRelease
    options.release = javaRelease as int
}
tasks.withType(JavaCompile).configureEach {
    options.release = javaRelease as int
}
