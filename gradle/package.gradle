import org.apache.tools.ant.filters.ReplaceTokens

ext.distBinSpec = copySpec {
    from('.') {
        include 'README.md'
        include 'INSTALL'
        include 'LICENSE'
    }
    from('src/dist') {
        exclude 'bin'
        exclude 'samples'
        exclude 'media'
        filter(ReplaceTokens, tokens: ['griffon.version': version, 'groovy.version': groovyVersion])
    }
    from('src/dist/bin') {
        into 'bin'
        filter(ReplaceTokens, tokens: ['griffon.version': version, 'groovy.version': groovyVersion])
        fileMode = 0755
    }
    from('src/dist/media') {
        into 'media'
    }
    from('src/dist/samples') {
        into 'samples'
        exclude '**/*.groovy'
        exclude '**/*.java'
        exclude '**/*.properties'
        exclude '**/*.xml'
        exclude '**/*.txt'
        exclude '**/html'
        exclude '**/*.md'
    }
    from('src/dist/samples') {
        into 'samples'
        include '**/*.groovy'
        include '**/*.java'
        include '**/*.properties'
        include '**/*.xml'
        include '**/*.txt'
        include '**/html'
        include '**/*.md'
        filter(ReplaceTokens, tokens: ['griffon.version': version, 'groovy.version': groovyVersion])
    }
    //from(project(':griffon-guide').file('src/griffon')) {
    //    into 'src/griffon'
    //    filter(ReplaceTokens, tokens: ['griffon.version': version, 'groovy.version': groovyVersion])
    //}
    into('lib') {
        from(project(':griffon-cli').configurations.runtimeClasspath) {
            exclude 'griffon*'
        }
    }
    into('lib/shell') {
        from((project(':griffon-shell').configurations.runtimeClasspath - project(':griffon-cli').configurations.runtimeClasspath)) {
            exclude 'griffon*'
        }
    }

    ['rt', 'cli', 'scripts', 'resources', 'shell'].each { subproj ->
        from(project(':griffon-' + subproj).jar.outputs.files) {
            into('dist')
        }
    }

    /*
    from(project(':griffon-rt').osgiBundleSingle.outputs.files) {
        into('dist/osgi')
    }
    from(project(':griffon-rt').osgiBundleFull.outputs.files) {
        into('dist/osgi')
    }
    */

    into('scripts') {
        from(project(":griffon-scripts").sourceSets.main.allSource)
    }

    //into('doc') {
    //    from(project(':griffon-guide').jarApi.outputs.files)
    //    from(project(':griffon-guide').jarSource.outputs.files)
    //    from(project(':griffon-guide').jarSourceHtml.outputs.files)
    //    from(project(':griffon-guide').jarCliApi.outputs.files)
    //    from(project(':griffon-guide').jarCliSource.outputs.files)
    //}
    into('doc') {
        from('src/dist/doc')
        filter(ReplaceTokens, tokens: ['griffon.version': version, 'groovy.version': groovyVersion])
    }

    //into('guide') {
    //    from(project(':griffon-guide').buildGuide.outputs.files)
    //}
}

tasks.register('zipBinary', Zip) {
    dependsOn(':griffon-guide:dist')
    description = "Zips the binary distribution."
    archiveClassifier.set('bin')
    into "griffon-$version"
    with distBinSpec
}

tasks.register('tarBinary', Tar) {
    description = "Tars the binary distribution."
    archiveClassifier.set('bin')
    into "griffon-$version"
    with distBinSpec
    compression = Compression.GZIP
}

ext.distSourceSpec = copySpec {
    from('.') {
        exclude 'build'
        exclude '.git*'
        exclude 'clover.license'
        exclude '.idea'
        exclude '.clover'
        exclude '.gradle'
        exclude 'buildSrc/build'
        exclude 'buildSrc/.gradle'
        exclude 'buildSrc/.idea'
        exclude 'subprojects/griffon-*/build'
        exclude 'subprojects/griffon-*/.gradle'
        exclude 'subprojects/griffon-*/.idea'
        exclude 'subprojects/griffon-*/.clover'
        exclude 'subprojects/griffon-*/*.ipr'
        exclude 'subprojects/griffon-*/*.iml'
        exclude 'subprojects/griffon-*/*.iws'
        exclude '**/cobertura.ser'
        exclude '*.ipr'
        exclude '*.iws'
        exclude '*.iml'
        exclude 'out'
    }
}

tasks.register('zipSource', Zip) {
    description = "Zips the source distribution."
    with distSourceSpec
    archiveClassifier.set('src')
    into "griffon-$version"
}

tasks.register('tarSource', Tar) {
    description = "Tars the source distribution."
    with distSourceSpec
    archiveClassifier.set('src')
    into "griffon-$version"
    compression = Compression.GZIP
}

ext.griffonHomeDir = System.getProperty('griffon.home') ?: System.env['GRIFFON_HOME']

tasks.register('checkGriffonHome') {
    doLast {
        def griffonHomeDir = System.getProperty('griffon.home') ?: System.getenv('GRIFFON_HOME')
        if (!griffonHomeDir) {
            throw new GradleException('You must define a value for $GRIFFON_HOME first!')
        }
        println "===> \$GRIFFON_HOME is set to $griffonHomeDir"
    }
}

tasks.register('installBinary', Sync) {
    dependsOn('checkGriffonHome')
    description = 'Installs the binary distribution at $GRIFFON_HOME.'
    with distBinSpec
    doLast {
        ant.chmod(dir: "${griffonHomeDir}/bin", excludes: '*.bat', perm: 'ugo+x')
    }
    into(griffonHomeDir)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}


