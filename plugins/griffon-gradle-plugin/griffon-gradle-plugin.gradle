config {
    info {
        tags = ['griffon', 'plugin']
    }

    docs {
        groovydoc {
            replaceJavadoc = true
            options {
                link 'https://docs.gradle.org/5.0/javadoc/', 'org.gradle.'
            }
        }
    }

    plugins {
        plugin {
            name                = 'griffon'
            id                  = 'org.codehaus.griffon.project'
            implementationClass = 'org.codehaus.griffon.gradle.GriffonPlugin'
        }
    }
}

dependencies {
    compileOnly gradleApi()

    //api ("org.kordamp.gradle:java-project-gradle-plugin:$kordampPluginVersion"){
    //    exclude group: 'com.google.inject', module: 'guice'
    //    exclude group: 'org.codehaus.groovy'
    //}
    compileOnly 'com.github.jengelman.gradle.plugins:shadow:6.1.0'

    testImplementation("org.spockframework:spock-core:$spockVersion") {
        exclude group: 'org.apache.groovy'
        exclude group: 'org.junit'
    }
}



processResources {
    expand(
        griffonVersion       : version,
        groovyVersion        : groovyVersion,
        spockVersion         : spockVersion,
        slf4jVersion         : slf4jVersion,
        junitVersion         : junitVersion,
        junit5Version        : junit5Version,
        junitPlatformVersion : junitPlatformVersion,
        jipsyVersion         : jipsyVersion,
        awaitilityVersion    : awaitilityVersion
    )
}

// resolve conflict with gradle groovy 3 and project groogy 4
tasks.withType(GroovyCompile).configureEach {
    if (name == "compileTestGroovy") {
        groovyOptions.forkOptions.jvmArgs += [
            "--add-opens", "java.base/java.lang=ALL-UNNAMED",
            "-Dgroovy.target.bytecode=17"
        ]
        groovyOptions.fork = true
        groovyClasspath = configurations.detachedConfiguration(
            dependencies.create("org.apache.groovy:groovy:$groovyVersion")
        )
    }
}