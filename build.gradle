/*
 * griffon-mini: fork enxuto do Griffon 1.x.
 *
 *  - griffon-rt            runtime + toolkit Swing + AST transformations de compilação
 *  - griffon-test          suporte mínimo a testes (@TestFor, GriffonUnitTestCase, mocks)
 *  - griffon-gradle-plugin plugin Gradle que configura apps Griffon 1.x
 */

subprojects {
    group = 'org.codehaus.griffon'
    version = rootProject.version

    repositories {
        mavenCentral()
        mavenLocal()
    }

    if (name == 'griffon-gradle-plugin') return

    apply plugin: 'java-library'
    apply plugin: 'groovy'
    apply plugin: 'maven-publish'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(javaToolchainVersion as int)
            vendor = JvmVendorSpec.AZUL
        }
        withSourcesJar()
    }

    // Compilação conjunta: Java e Groovy ficam em src/main/groovy
    sourceSets.main.java.srcDirs = []

    tasks.withType(GroovyCompile).configureEach {
        sourceCompatibility = javaRelease
        targetCompatibility = javaRelease
        options.release = javaRelease as int
        options.encoding = 'UTF-8'
        groovyOptions.encoding = 'UTF-8'
        groovyOptions.optimizationOptions.indy = true
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = javaRelease as int
        options.encoding = 'UTF-8'
    }

    tasks.withType(Jar).configureEach {
        manifest {
            attributes(
                'Implementation-Title': project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor': 'mobilemind',
                'Specification-Title': project.name,
                'Specification-Version': project.version
            )
        }
    }

    publishing {
        publications {
            maven(MavenPublication) {
                from components.java
            }
        }
    }
}
