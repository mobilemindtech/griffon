import java.text.SimpleDateFormat

apply plugin: 'base'
apply plugin: 'idea'
apply plugin: 'eclipse'

buildscript {
    repositories {
        mavenCentral()
        mavenLocal()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.bmuschko:gradle-izpack-plugin:3.2'
        //classpath 'com.bmuschko:gradle-java2html-plugin:2.0.1'
    }
}

mavenizedProjects().each { proj ->
    proj.apply from: "${rootDir}/gradle/maven.gradle"
}

evaluationDependsOn(':griffon-rt')
evaluationDependsOn(':griffon-cli')
evaluationDependsOn(':griffon-resources')
evaluationDependsOn(':griffon-scripts')
evaluationDependsOn(':griffon-shell')
evaluationDependsOn(':griffon-wrapper')
evaluationDependsOn(':griffon-guide')

// dependsOnChildren()

subprojects { subproj ->
    apply plugin: 'idea'
    if(plugins.hasPlugin('java') || plugins.hasPlugin('groovy')){
        sourceCompatibility = 24
        targetCompatibility = 24
        group = 'org.codehaus.griffon'

        //apply from: "${rootDir}/gradle/coverage.gradle"
        //apply from: "${rootDir}/gradle/codeQuality.gradle"
    }

    if(plugins.hasPlugin("groovy")){
        dependencies {
            implementation("org.apache.groovy:groovy-all:$groovyVersion")
            implementation("org.apache.groovy:groovy-dateutil:$groovyVersion")

        }

        tasks.withType(GroovyCompile).configureEach {
            groovyOptions.forkOptions.jvmArgs += ['--add-exports', 'java.base/java.io=ALL-UNNAMED']
        }
    }

    repositories {
        mavenCentral()
        mavenLocal()
    }

    // resolve conflict with gradle groovy 3 and project groogy 4
    tasks.withType(GroovyCompile).configureEach {
        if (name == "compileTestGroovy") {
            groovyOptions.forkOptions.jvmArgs += [
                "--add-opens", "java.base/java.lang=ALL-UNNAMED",
                "-Dgroovy.target.bytecode=17"
            ]
            groovyOptions.fork = true
            groovyClasspath = configurations.detachedConfiguration(
                dependencies.create("org.apache.groovy:groovy:$groovyVersion")
            )
        }
    }

}

Date buildTimeAndDate = new Date()
ext {
    buildTime = new SimpleDateFormat('dd-MMM-yyyy').format(buildTimeAndDate)
    buildDate = new SimpleDateFormat('hh:mm aa').format(buildTimeAndDate)
}

configure(mavenizedProjects()) { proj ->
    proj.task('checkManifest') {
        dependsOn proj.classes
        doLast {
            proj.tasks.withType(Jar).each { jarfile ->
                jarfile.manifest {
                    attributes(
                        'Built-By': System.properties['user.name'],
                        'Created-By': System.properties['java.version'] + " (" + System.properties['java.vendor'] + " " + System.getProperty("java.vm.version") + ")",
                        'Build-Date': buildTime,
                        'Build-Time': buildDate,
                        'Specification-Title': proj.name,
                        'Specification-Version': project.version,
                        'Specification-Vendor': 'griffon-framework.org',
                        'Implementation-Title': proj.name,
                        'Implementation-Version': project.version,
                        'Implementation-Vendor': 'griffon-framework.org'
                    )
                }
            }
        }
    }
    proj.jar.dependsOn proj.checkManifest
}

// @todo move apply statements to the top of the build script
apply from: "${rootDir}/gradle/package.gradle"
apply from: "${rootDir}/gradle/installer.gradle"

tasks.register('allTests') {
    dependsOn("clean", ':griffon-rt:test', ':griffon-cli:test')
    description = "Runs all tests."
}

tasks.register('fullDist') {
    dependsOn('zipBinary', 'zipSource', 'tarBinary', 'tarSource', 'izPackCreateInstaller', 'deb')
    description = "Assembles all packages."
}

tasks.register('bambooStage1') {
    dependsOn('allTests')
    description = "Makes a full test run and assembles all packages."
}

tasks.register('bambooStage2') {
    dependsOn('bambooStage1', 'fullDist', 'rpm')
    description = "Makes a full test run and assembles all packages."
}

def mavenizedProjects() {
    [
        project(':griffon-rt'),
        project(':griffon-cli'),
        project(':griffon-resources'),
        project(':griffon-scripts'),
        project(':griffon-shell')
    ]
}

